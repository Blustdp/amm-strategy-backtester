name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "Tag must look like v1.1.4 (got: $TAG)"
            exit 1
          fi
          npm pkg set "version=$VERSION"
          echo "Publishing version $VERSION"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check version is not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${{ github.event.repository.name }}@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION is already on npm. Bump package.json and push a new tag."
            exit 1
          fi
          echo "Version $VERSION is available to publish"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
